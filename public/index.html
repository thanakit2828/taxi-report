<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>หลังบ้าน แจ้งเรื่องแท็กซี่</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="แจ้งเรื่องแท็กซี่">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<section id="loginView" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>แจ้งเรื่องแท็กซี่</h1>
    <p>ระบบหลังบ้านสำหรับผู้ดูแลและเจ้าของอู่</p>
    <div id="loginErr" class="notice" hidden role="alert"></div>
    <label>ชื่อผู้ใช้ <input id="loginUser" required autocomplete="username" autocapitalize="none"></label>
    <label>รหัสผ่าน <input id="loginPass" type="password" required autocomplete="current-password"></label>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
</section>

<div id="appView" class="app" hidden>
  <header class="bar">
    <strong>แจ้งเรื่องแท็กซี่</strong>
    <nav id="nav" aria-label="เมนู"></nav>
    <div class="who"><span id="whoName"></span>
      <button id="changePwBtn" type="button" class="ghost">เปลี่ยนรหัสผ่าน</button>
      <button id="logoutBtn" type="button" class="ghost">ออกจากระบบ</button>
    </div>
  </header>
  <main id="view" class="wide"></main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
